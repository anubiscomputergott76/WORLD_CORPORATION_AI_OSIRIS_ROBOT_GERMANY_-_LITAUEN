<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OSIRIS MATRIX 888 CORE</title>

<style>
body {
margin:0;
overflow:hidden;
background:black;
font-family: monospace;
color:#00ffcc;
}

/* MATRIX */
canvas {
position:absolute;
top:0;
left:0;
}

/* UI PANEL */
.panel {
position:absolute;
top:20px;
left:20px;
background:rgba(0,0,0,0.7);
border:1px solid #00ffcc;
padding:20px;
box-shadow:0 0 25px #00ffcc;
border-radius:10px;
}

h1 {
color:#00ffcc;
font-size:18px;
}

button {
display:block;
margin:8px 0;
padding:10px;
background:black;
border:1px solid #00ffcc;
color:#00ffcc;
cursor:pointer;
width:200px;
transition:0.2s;
}

button:hover {
background:#00ffcc;
color:black;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="panel">
<h1>OSIRIS CORPORATION CORE</h1>
<p>MATRIX888 SYSTEM ONLINE</p>

<button onclick="msg('AI ENGINE ACTIVE')">AI ENGINE</button>
<button onclick="msg('ROBOTICS ONLINE')">ROBOTICS</button>
<button onclick="msg('FINANCE CONNECTED')">FINANCE</button>
<button onclick="msg('REAL ESTATE SCAN')">PROPERTY</button>
<button onclick="msg('LANGUAGE SYSTEM ACTIVE')">LANGUAGE</button>

<p id="log">SYSTEM READY</p>
</div>

<script>

// ===== MATRIX =====
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01AIOSIRISROBOTMATRIXFUTURE∞";
letters = letters.split("");

let font = 14;
let columns = canvas.width / font;

let drops = [];

for(let i=0;i<columns;i++) drops[i]=1;

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ffcc";
ctx.font = font + "px monospace";

for(let i=0;i<drops.length;i++){
let text = letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text, i*font, drops[i]*font);

if(drops[i]*font > canvas.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
}

setInterval(draw,33);

// ===== UI =====
function msg(t){
document.getElementById("log").innerText = t;
}
</script>

</body>
</html>
